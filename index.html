<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Пчела и Пианино</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #f2f2f7;
    color: #333;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
  }
  h1 {
    font-size: 16px;
    margin: 0;
    flex: 1;
    font-weight: 700;
    color: #111;
  }
  .btn {
    appearance: none;
    border: 0;
    border-radius: 999px;
    padding: 8px 12px;
    background: #e5e5ea;
    color: #333;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.1s;
  }
  .btn:active { background: #d1d1d6; }
  
  #controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 20px;
    padding: 15px;
    background: #ffffff;
    margin: 0 12px 10px;
    border-radius: 16px;
    border: 1px solid #e5e5ea;
  }
  .control-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .control-item label {
    font-size: 12px;
    color: #666;
    display: flex;
    justify-content: space-between;
    font-weight: 500;
  }
  .control-item input[type=range] {
    width: 100%;
    accent-color: #f1c40f;
    height: 24px;
  }

  #display-area {
    flex: 1;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    background: #ffffff;
    border-radius: 20px;
    margin: 0 12px;
    overflow: hidden;
    position: relative;
    border: 1px solid #e5e5ea;
  }
  #animal-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: none;
    transition: transform 0.1s ease;
  }
  #placeholder {
    font-size: 16px;
    text-align: center;
    color: #aaa;
  }

  #keyboard {
    display: flex;
    height: 140px;
    padding: 12px;
    gap: 4px;
  }
  .key {
    flex: 1;
    background: #ffffff;
    border-radius: 0 0 12px 12px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 15px;
    font-weight: 700;
    font-size: 13px;
    color: #333;
    box-shadow: inset 0 -6px 0 #e5e5ea; 
    transition: all 0.05s;
    cursor: pointer;
    border: 1px solid #e5e5ea;
    border-top: none;
    touch-action: none;
  }
  .key.active {
    background: #f1c40f;
    box-shadow: inset 0 -2px 0 #d4ac0d;
    transform: translateY(4px);
    color: #000;
  }
  .key.empty-key {
    background: #f8f8f8;
    color: #ccc;
    box-shadow: inset 0 -6px 0 #e5e5ea;
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  .animate-pop {
    animation: pop 0.2s ease;
  }
</style>
</head>
<body>
  <header>
    <h1>Пчела жужжит!</h1>
    <label class="btn">
      Загрузить 8 файлов
      <input id="fileInput" type="file" accept="image/*" multiple hidden>
    </label>
    <button id="clearBtn" class="btn" type="button">Сброс</button>
  </header>

  <div id="controls">
    <div class="control-item">
      <label>Вибрато <span id="val-vib">12</span> Гц</label>
      <input type="range" id="vib" min="1" max="30" value="12">
    </div>
    <div class="control-item">
      <label>Жужжание <span id="val-trem">30</span> Гц</label>
      <input type="range" id="trem" min="5" max="60" value="30">
    </div>
    <div class="control-item">
      <label>Глубина <span id="val-depth">0.5</span></label>
      <input type="range" id="depth" min="0" max="0.9" step="0.1" value="0.5">
    </div>
    <div class="control-item">
      <label>Тембр <span id="val-filter">2000</span> Гц</label>
      <input type="range" id="filter" min="500" max="5000" step="100" value="2000">
    </div>
  </div>

  <div id="display-area">
    <div id="placeholder">Выбери картинку на клавиатуре,<br>или загрузи 8 файлов (можно гиф)</div>
    <img id="animal-img" alt="Животное">
  </div>

  <div id="keyboard">
    <!-- Клавиши будут созданы в JS -->
  </div>

<script>
const NUM_KEYS = 8;
const NOTES = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
const NOTE_NAMES = ['До', 'Ре', 'Ми', 'Фа', 'Соль', 'Ля', 'Си', 'До²'];

let ctx = null;
let master = null;
let images = new Array(NUM_KEYS).fill(null);
let activeNotes = {}; 

const params = {
  vibRate: 12,
  tremRate: 30,
  tremDepth: 0.5,
  filterCutoff: 2000
};

// 🔥 НАДЕЖНАЯ ФУНКЦИЯ ЗАПУСКА ЗВУКА
function initAudio() {
  if (!ctx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    ctx = new AudioCtx();
    master = ctx.createGain();
    master.gain.value = 0.6;
    
    const compressor = ctx.createDynamicsCompressor();
    compressor.threshold.value = -18;
    compressor.knee.value = 20;
    compressor.ratio.value = 6;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.25;
    
    master.connect(compressor).connect(ctx.destination);
  }
  
  // Если iOS поставил звук на паузу (например, когда свернули браузер) - будим его
  if (ctx.state === 'suspended' || ctx.state === 'interrupted') {
    ctx.resume();
  }
}

// Будим звук при любом касании экрана
document.addEventListener('touchstart', initAudio, { passive: true });
document.addEventListener('pointerdown', initAudio, { passive: true });

function updateParams() {
  params.vibRate = +document.getElementById('vib').value;
  params.tremRate = +document.getElementById('trem').value;
  params.tremDepth = +document.getElementById('depth').value;
  params.filterCutoff = +document.getElementById('filter').value;

  document.getElementById('val-vib').textContent = params.vibRate;
  document.getElementById('val-trem').textContent = params.tremRate;
  document.getElementById('val-depth').textContent = params.tremDepth.toFixed(1);
  document.getElementById('val-filter').textContent = params.filterCutoff;

  const now = ctx ? ctx.currentTime : 0;
  Object.values(activeNotes).forEach(note => {
    note.lfo.frequency.setTargetAtTime(params.vibRate, now, 0.05);
    note.tremoloLfo.frequency.setTargetAtTime(params.tremRate, now, 0.05);
    note.tremoloDepthGain.gain.setTargetAtTime(params.tremDepth, now, 0.05);
    note.filter.frequency.setTargetAtTime(params.filterCutoff, now, 0.05);
  });
}

['vib', 'trem', 'depth', 'filter'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateParams);
});

function playNote(index) {
  initAudio(); // Принудительно проверяем звук перед каждой нотой!
  if (!ctx) return;
  
  if (activeNotes[index]) {
    releaseNote(index);
  }

  const now = ctx.currentTime;
  const freq = NOTES[index];

  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(freq, now);

  const lfo = ctx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.setValueAtTime(params.vibRate, now);
  const lfoGain = ctx.createGain();
  lfoGain.gain.setValueAtTime(20, now); 
  lfo.connect(lfoGain);
  lfoGain.connect(osc.frequency);

  const tremoloNode = ctx.createGain();
  tremoloNode.gain.value = 0.5; 
  
  const tremoloLfo = ctx.createOscillator();
  tremoloLfo.type = 'sine';
  tremoloLfo.frequency.setValueAtTime(params.tremRate, now);
  
  const tremoloDepthGain = ctx.createGain();
  tremoloDepthGain.gain.setValueAtTime(params.tremDepth, now);
  
  tremoloLfo.connect(tremoloDepthGain);
  tremoloDepthGain.connect(tremoloNode.gain); 

  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(params.filterCutoff, now);
  filter.Q.value = 1.5;

  const envelope = ctx.createGain();
  envelope.gain.setValueAtTime(0, now);
  envelope.gain.linearRampToValueAtTime(1, now + 0.05); 

  osc.connect(filter);
  filter.connect(tremoloNode);
  tremoloNode.connect(envelope);
  envelope.connect(master);

  osc.start(now);
  lfo.start(now);
  tremoloLfo.start(now);

  activeNotes[index] = {
    osc, lfo, tremoloLfo, tremoloDepthGain, filter, envelope
  };
}

function releaseNote(index) {
  if (!activeNotes[index] || !ctx) return;
  const note = activeNotes[index];
  const now = ctx.currentTime;

  note.envelope.gain.cancelScheduledValues(now);
  note.envelope.gain.setValueAtTime(note.envelope.gain.value, now);
  note.envelope.gain.linearRampToValueAtTime(0, now + 0.2);

  note.osc.stop(now + 0.25);
  note.lfo.stop(now + 0.25);
  note.tremoloLfo.stop(now + 0.25);

  delete activeNotes[index];
}

const keyboardEl = document.getElementById('keyboard');
const imgEl = document.getElementById('animal-img');
const placeholderEl = document.getElementById('placeholder');

function renderKeyboard() {
  keyboardEl.innerHTML = '';
  for (let i = 0; i < NUM_KEYS; i++) {
    const btn = document.createElement('button');
    btn.className = 'key';
    btn.type = 'button';
    btn.dataset.index = i;
    btn.textContent = NOTE_NAMES[i];

    if (!images[i]) btn.classList.add('empty-key');

    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      btn.setPointerCapture(e.pointerId); 
      playNote(i);
      btn.classList.add('active');
      showImage(i, true);
    });

    const release = () => {
      releaseNote(i);
      btn.classList.remove('active');
      if (images[i]) {
         showImage(i, false);
      }
    };

    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('lostpointercapture', release);

    keyboardEl.appendChild(btn);
  }
}

function showImage(index, isPressed) {
  const imgData = images[index];
  
  if (imgData) {
    imgEl.style.display = 'block';
    placeholderEl.style.display = 'none';
    
    if (isPressed && imgData.animated) {
      imgEl.src = imgData.animated;
      imgEl.classList.remove('animate-pop');
      void imgEl.offsetWidth;
      imgEl.classList.add('animate-pop');
    } else {
      imgEl.src = imgData.static;
    }
  } else {
    imgEl.style.display = 'none';
    placeholderEl.style.display = 'block';
    placeholderEl.innerHTML = `Поза для ноты <b>${NOTE_NAMES[index]}</b><br>ещё не загружена`;
  }
}

function readFileAsDataURL(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.readAsDataURL(file);
  });
}

async function processFile(file) {
  const dataUrl = await readFileAsDataURL(file);

  if (file.type === 'image/gif') {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        canvas.getContext('2d').drawImage(img, 0, 0);
        const staticPoster = canvas.toDataURL('image/jpeg', 0.8);
        resolve({ static: staticPoster, animated: dataUrl });
      };
      img.src = dataUrl;
    });
  } 
  
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX_SIZE = 800; 
      let width = img.width;
      let height = img.height;

      if (width > height && width > MAX_SIZE) {
        height = Math.round(height * MAX_SIZE / width);
        width = MAX_SIZE;
      } else if (height > MAX_SIZE) {
        width = Math.round(width * MAX_SIZE / height);
        height = MAX_SIZE;
      }

      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
      resolve({ static: resizedDataUrl, animated: null });
    };
    img.src = dataUrl;
  });
}

const fileInput = document.getElementById('fileInput');

fileInput.addEventListener('change', async () => {
  const files = [...fileInput.files].slice(0, NUM_KEYS);
  if (files.length === 0) return;

  const btnLabel = fileInput.closest('label');
  const oldText = btnLabel.childNodes[0].nodeValue;
  btnLabel.childNodes[0].nodeValue = 'Грузим... ';

  for (let i = 0; i < files.length; i++) {
    images[i] = await processFile(files[i]);
  }

  try {
    localStorage.setItem('animalSynthImagesV3', JSON.stringify(images));
  } catch (e) {
    alert('Ошибка: не хватает памяти для сохранения. Попробуйте загрузить гифки поменьше.');
  }

  btnLabel.childNodes[0].nodeValue = oldText;
  fileInput.value = '';
  renderKeyboard();
  showImage(0, false); 
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (confirm('Удалить все рисунки?')) {
    images = new Array(NUM_KEYS).fill(null);
    localStorage.removeItem('animalSynthImagesV3');
    imgEl.style.display = 'none';
    placeholderEl.style.display = 'block';
    placeholderEl.innerHTML = 'Выбери картинку на клавиатуре,<br>или загрузи 8 файлов';
    renderKeyboard();
  }
});

function init() {
  const saved = localStorage.getItem('animalSynthImagesV3');
  if (saved) {
    try {
      images = JSON.parse(saved);
    } catch (e) {
      console.error('Ошибка чтения картинок');
    }
  }
  renderKeyboard();
  updateParams(); 
}

init();
</script>
</body>
</html>
