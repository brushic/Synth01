<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Пчела и Пианино</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #1a1a24;
    color: #fff;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
  }
  h1 {
    font-size: 16px;
    margin: 0;
    flex: 1;
    font-weight: 600;
  }
  .btn {
    appearance: none;
    border: 0;
    border-radius: 999px;
    padding: 8px 12px;
    background: #333344;
    color: #fff;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .btn:active { background: #444455; }
  
  /* Панель управления (крутилки) */
  #controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    padding: 10px 15px;
    background: #222230;
    margin: 0 10px 5px;
    border-radius: 15px;
    border: 1px solid #333344;
  }
  .control-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .control-item label {
    font-size: 11px;
    color: #aaa;
    display: flex;
    justify-content: space-between;
  }
  .control-item input[type=range] {
    width: 100%;
    accent-color: #f1c40f; /* Пчелиный цвет */
    height: 20px;
  }

  /* Область с картинкой */
  #display-area {
    flex: 1;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    background: #222230;
    border-radius: 20px;
    margin: 0 10px;
    overflow: hidden;
    position: relative;
  }
  #animal-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: none;
    transition: transform 0.1s ease;
  }
  #placeholder {
    font-size: 16px;
    text-align: center;
    opacity: 0.5;
  }

  /* Клавиатура */
  #keyboard {
    display: flex;
    height: 140px;
    padding: 10px;
    gap: 3px;
  }
  .key {
    flex: 1;
    background: #fff;
    border-radius: 0 0 10px 10px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 15px;
    font-weight: bold;
    font-size: 13px;
    color: #333;
    box-shadow: inset 0 -6px 0 #ccc, 0 4px 6px rgba(0,0,0,0.3);
    transition: all 0.05s;
    cursor: pointer;
    border: none;
    touch-action: none;
  }
  .key.active {
    background: #f1c40f; /* Желтый при нажатии */
    box-shadow: inset 0 -2px 0 #d4ac0d;
    transform: translateY(4px);
  }
  .key.empty-key {
    background: #333;
    color: #888;
    box-shadow: inset 0 -6px 0 #111, 0 4px 6px rgba(0,0,0,0.3);
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  .animate-pop {
    animation: pop 0.2s ease;
  }
</style>
</head>
<body>
  <header>
    <h1>Пчела жужжит!</h1>
    <label class="btn">
      Загрузить 8 рисунков
      <input id="fileInput" type="file" accept="image/*" multiple hidden>
    </label>
    <button id="clearBtn" class="btn" type="button">Сброс</button>
  </header>

  <!-- Крутилки -->
  <div id="controls">
    <div class="control-item">
      <label>Вибрато <span id="val-vib">12</span> Гц</label>
      <input type="range" id="vib" min="1" max="30" value="12">
    </div>
    <div class="control-item">
      <label>Жужжание <span id="val-trem">30</span> Гц</label>
      <input type="range" id="trem" min="5" max="60" value="30">
    </div>
    <div class="control-item">
      <label>Глубина <span id="val-depth">0.5</span></label>
      <input type="range" id="depth" min="0" max="0.9" step="0.1" value="0.5">
    </div>
    <div class="control-item">
      <label>Тембр <span id="val-filter">2000</span> Гц</label>
      <input type="range" id="filter" min="500" max="5000" step="100" value="2000">
    </div>
  </div>

  <div id="display-area">
    <div id="placeholder">Выбери картинку на клавиатуре,<br>или загрузи 8 рисунков</div>
    <img id="animal-img" alt="Животное">
  </div>

  <div id="keyboard">
    <!-- Клавиши будут созданы в JS -->
  </div>

<script>
const NUM_KEYS = 8;
const NOTES = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
const NOTE_NAMES = ['До', 'Ре', 'Ми', 'Фа', 'Соль', 'Ля', 'Си', 'До²'];

let ctx = null;
let master = null;
let images = new Array(NUM_KEYS).fill(null);
let activeNotes = {}; // Здесь храним играющие сейчас ноты

// Значения крутилок
const params = {
  vibRate: 12,
  tremRate: 30,
  tremDepth: 0.5,
  filterCutoff: 2000
};

// Разблокировка звука для iOS
document.addEventListener('touchstart', function unlockAudio() {
  if (!ctx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    ctx = new AudioCtx();
    master = ctx.createGain();
    master.gain.value = 0.6;
    const compressor = ctx.createDynamicsCompressor();
    compressor.threshold.value = -18;
    compressor.knee.value = 20;
    compressor.ratio.value = 6;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.25;
    master.connect(compressor).connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
  
  const buffer = ctx.createBuffer(1, 1, 22050);
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.connect(ctx.destination);
  source.start(0);
  document.removeEventListener('touchstart', unlockAudio);
}, { once: true });

// Обработка крутилок
function updateParams() {
  params.vibRate = +document.getElementById('vib').value;
  params.tremRate = +document.getElementById('trem').value;
  params.tremDepth = +document.getElementById('depth').value;
  params.filterCutoff = +document.getElementById('filter').value;

  document.getElementById('val-vib').textContent = params.vibRate;
  document.getElementById('val-trem').textContent = params.tremRate;
  document.getElementById('val-depth').textContent = params.tremDepth.toFixed(1);
  document.getElementById('val-filter').textContent = params.filterCutoff;

  // Обновляем звук "на лету", если сейчас что-то играет
  const now = ctx ? ctx.currentTime : 0;
  Object.values(activeNotes).forEach(note => {
    note.lfo.frequency.setTargetAtTime(params.vibRate, now, 0.05);
    note.tremoloLfo.frequency.setTargetAtTime(params.tremRate, now, 0.05);
    note.tremoloDepthGain.gain.setTargetAtTime(params.tremDepth, now, 0.05);
    note.filter.frequency.setTargetAtTime(params.filterCutoff, now, 0.05);
  });
}

['vib', 'trem', 'depth', 'filter'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateParams);
});

// Включение звука при нажатии
function playNote(index) {
  if (!ctx) return;
  
  // Если эта нота уже играет (например, палец скользнул), глушим старую
  if (activeNotes[index]) {
    releaseNote(index);
  }

  const now = ctx.currentTime;
  const freq = NOTES[index];

  // 1. Основной генератор (пила)
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(freq, now);

  // 2. Вибрато
  const lfo = ctx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.setValueAtTime(params.vibRate, now);
  const lfoGain = ctx.createGain();
  lfoGain.gain.setValueAtTime(20, now); // Амплитуда вибрато 20 Гц
  lfo.connect(lfoGain);
  lfoGain.connect(osc.frequency);

  // 3. Тремоло (Жужжание)
  const tremoloNode = ctx.createGain();
  tremoloNode.gain.value = 0.5; // Базовая громкость
  
  const tremoloLfo = ctx.createOscillator();
  tremoloLfo.type = 'sine';
  tremoloLfo.frequency.setValueAtTime(params.tremRate, now);
  
  const tremoloDepthGain = ctx.createGain();
  tremoloDepthGain.gain.setValueAtTime(params.tremDepth, now);
  
  tremoloLfo.connect(tremoloDepthGain);
  tremoloDepthGain.connect(tremoloNode.gain); // Модулируем громкость

  // 4. Фильтр
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(params.filterCutoff, now);
  filter.Q.value = 1.5;

  // 5. Огибающая (плавное появление и затухание)
  const envelope = ctx.createGain();
  envelope.gain.setValueAtTime(0, now);
  envelope.gain.linearRampToValueAtTime(1, now + 0.05); // Атака

  // Сборка графа
  osc.connect(filter);
  filter.connect(tremoloNode);
  tremoloNode.connect(envelope);
  envelope.connect(master);

  // Запуск
  osc.start(now);
  lfo.start(now);
  tremoloLfo.start(now);

  // Сохраняем в активные, чтобы можно было отпустить или покрутить ручки
  activeNotes[index] = {
    osc, lfo, tremoloLfo, tremoloDepthGain, filter, envelope
  };
}

// Выключение звука (когда отпустили палец)
function releaseNote(index) {
  if (!activeNotes[index]) return;
  const note = activeNotes[index];
  const now = ctx.currentTime;

  // Плавно гасим громкость
  note.envelope.gain.cancelScheduledValues(now);
  note.envelope.gain.setValueAtTime(note.envelope.gain.value, now);
  note.envelope.gain.linearRampToValueAtTime(0, now + 0.2);

  // Останавливаем генераторы чуть позже
  note.osc.stop(now + 0.25);
  note.lfo.stop(now + 0.25);
  note.tremoloLfo.stop(now + 0.25);

  delete activeNotes[index];
}

// Отрисовка клавиатуры
const keyboardEl = document.getElementById('keyboard');
const imgEl = document.getElementById('animal-img');
const placeholderEl = document.getElementById('placeholder');

function renderKeyboard() {
  keyboardEl.innerHTML = '';
  for (let i = 0; i < NUM_KEYS; i++) {
    const btn = document.createElement('button');
    btn.className = 'key';
    btn.type = 'button';
    btn.dataset.index = i;
    btn.textContent = NOTE_NAMES[i];

    if (!images[i]) btn.classList.add('empty-key');

    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      btn.setPointerCapture(e.pointerId); // Захватываем палец, чтобы работать при скольжении
      playNote(i);
      btn.classList.add('active');
      showImage(i);
    });

    const release = () => {
      releaseNote(i);
      btn.classList.remove('active');
    };

    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('lostpointercapture', release);

    keyboardEl.appendChild(btn);
  }
}

// Показ картинки
function showImage(index) {
  const imgData = images[index];
  if (imgData) {
    imgEl.src = imgData;
    imgEl.style.display = 'block';
    placeholderEl.style.display = 'none';
    
    imgEl.classList.remove('animate-pop');
    void imgEl.offsetWidth;
    imgEl.classList.add('animate-pop');
  } else {
    imgEl.style.display = 'none';
    placeholderEl.style.display = 'block';
    placeholderEl.innerHTML = `Поза для ноты <b>${NOTE_NAMES[index]}</b><br>ещё не загружена`;
  }
}

// Сжатие картинок
function resizeImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_SIZE = 800; 
        let width = img.width;
        let height = img.height;

        if (width > height && width > MAX_SIZE) {
          height = Math.round(height * MAX_SIZE / width);
          width = MAX_SIZE;
        } else if (height > MAX_SIZE) {
          width = Math.round(width * MAX_SIZE / height);
          height = MAX_SIZE;
        }

        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

const fileInput = document.getElementById('fileInput');

fileInput.addEventListener('change', async () => {
  const files = [...fileInput.files].slice(0, NUM_KEYS);
  if (files.length === 0) return;

  const btnLabel = fileInput.closest('label');
  const oldText = btnLabel.childNodes[0].nodeValue;
  btnLabel.childNodes[0].nodeValue = 'Грузим... ';

  for (let i = 0; i < files.length; i++) {
    const base64 = await resizeImage(files[i]);
    images[i] = base64;
  }

  try {
    localStorage.setItem('animalSynthImagesV2', JSON.stringify(images));
  } catch (e) {
    alert('Ошибка: не хватает памяти для сохранения картинок.');
  }

  btnLabel.childNodes[0].nodeValue = oldText;
  fileInput.value = '';
  renderKeyboard();
  showImage(0);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (confirm('Удалить все рисунки?')) {
    images = new Array(NUM_KEYS).fill(null);
    localStorage.removeItem('animalSynthImagesV2');
    imgEl.style.display = 'none';
    placeholderEl.style.display = 'block';
    placeholderEl.innerHTML = 'Выбери картинку на клавиатуре,<br>или загрузи 8 рисунков';
    renderKeyboard();
  }
});

function init() {
  const saved = localStorage.getItem('animalSynthImagesV2');
  if (saved) {
    try {
      images = JSON.parse(saved);
    } catch (e) {
      console.error('Ошибка чтения картинок');
    }
  }
  renderKeyboard();
  updateParams(); // Инициализация текста на крутилках
}

init();
</script>
</body>
</html>
