<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Пчела и Пианино</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #1a1a24;
    color: #fff;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
  }
  h1 {
    font-size: 16px;
    margin: 0;
    flex: 1;
    font-weight: 600;
  }
  .btn {
    appearance: none;
    border: 0;
    border-radius: 999px;
    padding: 8px 12px;
    background: #333344;
    color: #fff;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .btn:active { background: #444455; }
  
  /* Область с картинкой */
  #display-area {
    flex: 1;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    background: #222230;
    border-radius: 20px;
    margin: 0 10px;
    overflow: hidden;
    position: relative;
  }
  #animal-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: none;
    transition: transform 0.1s ease;
  }
  #placeholder {
    font-size: 18px;
    text-align: center;
    opacity: 0.5;
  }

  /* Клавиатура */
  #keyboard {
    display: flex;
    height: 160px;
    padding: 10px;
    gap: 3px;
  }
  .key {
    flex: 1;
    background: #fff;
    border-radius: 0 0 10px 10px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 15px;
    font-weight: bold;
    font-size: 13px;
    color: #333;
    box-shadow: inset 0 -6px 0 #ccc, 0 4px 6px rgba(0,0,0,0.3);
    transition: all 0.05s;
    cursor: pointer;
    border: none;
  }
  .key.active {
    background: #e0e0e0;
    box-shadow: inset 0 -2px 0 #bbb;
    transform: translateY(4px);
  }
  .key.empty-key {
    background: #333;
    color: #888;
    box-shadow: inset 0 -6px 0 #111, 0 4px 6px rgba(0,0,0,0.3);
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  .animate-pop {
    animation: pop 0.2s ease;
  }
</style>
</head>
<body>
  <header>
    <h1>Пчела жужжит!</h1>
    <label class="btn">
      Загрузить 8 рисунков
      <input id="fileInput" type="file" accept="image/*" multiple hidden>
    </label>
    <button id="clearBtn" class="btn" type="button">Сброс</button>
  </header>

  <div id="display-area">
    <div id="placeholder">Выбери картинку на клавиатуре,<br>или загрузи 8 рисунков</div>
    <img id="animal-img" alt="Животное">
  </div>

  <div id="keyboard">
    <!-- Клавиши будут созданы в JS -->
  </div>

<script>
const NUM_KEYS = 8;
// Ноты: До, Ре, Ми, Фа, Соль, Ля, Си, До (следующей октавы)
const NOTES = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
const NOTE_NAMES = ['До', 'Ре', 'Ми', 'Фа', 'Соль', 'Ля', 'Си', 'До²'];

let ctx = null;
let master = null;
let images = new Array(NUM_KEYS).fill(null);

// Хитрость для iOS: разблокируем звук при первом касании экрана
document.addEventListener('touchstart', function unlockAudio() {
  if (!ctx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    ctx = new AudioCtx();
    master = ctx.createGain();
    master.gain.value = 0.5;
    const compressor = ctx.createDynamicsCompressor();
    compressor.threshold.value = -18;
    compressor.knee.value = 20;
    compressor.ratio.value = 6;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.25;
    master.connect(compressor).connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
  
  const buffer = ctx.createBuffer(1, 1, 22050);
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.connect(ctx.destination);
  source.start(0);
  document.removeEventListener('touchstart', unlockAudio);
}, { once: true });

// НОВАЯ ФУНКЦИЯ ЗВУКА ПЧЕЛЫ
function playNote(index) {
  if (!ctx) return;
  const now = ctx.currentTime;
  const freq = NOTES[index];

  // 1. Основной генератор (пила для жужжания)
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(freq, now);

  // 2. Вибрато (дрожание высоты тона)
  const lfo = ctx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.setValueAtTime(12, now); // 12 Гц
  const lfoGain = ctx.createGain();
  lfoGain.gain.setValueAtTime(20, now); // Отклонение на 20 Гц
  lfo.connect(lfoGain);
  lfoGain.connect(osc.frequency);

  // 3. Тремоло (быстрое изменение громкости - эффект "бзззз")
  const tremolo = ctx.createOscillator();
  tremolo.type = 'sine';
  tremolo.frequency.setValueAtTime(30, now); // 30 Гц
  const tremoloGain = ctx.createGain();
  tremoloGain.gain.setValueAtTime(0.4, now);
  
  const buzzGain = ctx.createGain();
  buzzGain.gain.setValueAtTime(0.6, now); // Базовая громкость
  
  tremolo.connect(tremoloGain);
  tremoloGain.connect(buzzGain.gain);

  // 4. Фильтр (убирает лишний резкий писк)
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(2500, now);
  filter.Q.value = 2;

  // 5. Огибающая (плавное затухание)
  const envelope = ctx.createGain();
  envelope.gain.setValueAtTime(0, now);
  envelope.gain.linearRampToValueAtTime(1, now + 0.05);
  envelope.gain.exponentialRampToValueAtTime(0.01, now + 0.8);

  // Сборка
  osc.connect(filter);
  filter.connect(envelope);
  envelope.connect(buzzGain);
  buzzGain.connect(master);

  // Запуск
  osc.start(now);
  lfo.start(now);
  tremolo.start(now);

  // Остановка
  osc.stop(now + 0.9);
  lfo.stop(now + 0.9);
  tremolo.stop(now + 0.9);
}

// Функция для уменьшения картинок
function resizeImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_SIZE = 800; 
        let width = img.width;
        let height = img.height;

        if (width > height && width > MAX_SIZE) {
          height = Math.round(height * MAX_SIZE / width);
          width = MAX_SIZE;
        } else if (height > MAX_SIZE) {
          width = Math.round(width * MAX_SIZE / height);
          height = MAX_SIZE;
        }

        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

const keyboardEl = document.getElementById('keyboard');
const imgEl = document.getElementById('animal-img');
const placeholderEl = document.getElementById('placeholder');

function renderKeyboard() {
  keyboardEl.innerHTML = '';
  for (let i = 0; i < NUM_KEYS; i++) {
    const btn = document.createElement('button');
    btn.className = 'key';
    btn.type = 'button';
    btn.dataset.index = i;
    btn.textContent = NOTE_NAMES[i];

    if (!images[i]) btn.classList.add('empty-key');

    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      playNote(i);
      btn.classList.add('active');
      showImage(i);
    });

    const release = () => btn.classList.remove('active');
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('pointerleave', release);

    keyboardEl.appendChild(btn);
  }
}

function showImage(index) {
  const imgData = images[index];
  if (imgData) {
    imgEl.src = imgData;
    imgEl.style.display = 'block';
    placeholderEl.style.display = 'none';
    
    imgEl.classList.remove('animate-pop');
    void imgEl.offsetWidth;
    imgEl.classList.add('animate-pop');
  } else {
    imgEl.style.display = 'none';
    placeholderEl.style.display = 'block';
    placeholderEl.innerHTML = `Поза для ноты <b>${NOTE_NAMES[index]}</b><br>ещё не загружена`;
  }
}

const fileInput = document.getElementById('fileInput');

fileInput.addEventListener('change', async () => {
  const files = [...fileInput.files].slice(0, NUM_KEYS);
  if (files.length === 0) return;

  const btnLabel = fileInput.closest('label');
  const oldText = btnLabel.childNodes[0].nodeValue;
  btnLabel.childNodes[0].nodeValue = 'Грузим... ';

  for (let i = 0; i < files.length; i++) {
    const base64 = await resizeImage(files[i]);
    images[i] = base64;
  }

  try {
    localStorage.setItem('animalSynthImagesV2', JSON.stringify(images));
  } catch (e) {
    alert('Ошибка: не хватает памяти для сохранения картинок.');
  }

  btnLabel.childNodes[0].nodeValue = oldText;
  fileInput.value = '';
  renderKeyboard();
  showImage(0);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (confirm('Удалить все рисунки?')) {
    images = new Array(NUM_KEYS).fill(null);
    localStorage.removeItem('animalSynthImagesV2');
    imgEl.style.display = 'none';
    placeholderEl.style.display = 'block';
    placeholderEl.innerHTML = 'Выбери картинку на клавиатуре,<br>или загрузи 8 рисунков';
    renderKeyboard();
  }
});

function init() {
  const saved = localStorage.getItem('animalSynthImagesV2');
  if (saved) {
    try {
      images = JSON.parse(saved);
    } catch (e) {
      console.error('Ошибка чтения картинок');
    }
  }
  renderKeyboard();
}

init();
</script>
</body>
</html>
